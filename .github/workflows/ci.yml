name: AXYRON ATOMIC CI

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate AXYRON STUDIO JavaScript syntax
        run: python scripts/check_frontend_js.py
      - name: Validate VPS installer shell syntax
        run: bash -n scripts/install_vps.sh && bash -n scripts/inspect_vps_state.sh
      - name: Compile Python modules
        run: python -m compileall -q api agent core rag sandbox audit tests scripts
      - name: Run unit tests
        env:
          API_KEY: ci-only-not-a-production-secret-0123456789
          DATABASE_URL: sqlite:///./ci-test.db
        run: python -m pytest -q


  container-image-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build the production Docker image (no deployment)
        run: docker build --pull --tag axyron-atomic:ci .
      - name: Smoke-test the packaged API and AXYRON STUDIO
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name axyron-atomic-ci -p 127.0.0.1:18080:8000 axyron-atomic:ci
          cleanup() { docker stop axyron-atomic-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/live >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          curl --fail --silent --show-error --output /tmp/axyron-homepage http://127.0.0.1:18080/
          grep -q "Axyron Atomic" /tmp/axyron-homepage
          curl --fail --silent --show-error --output /tmp/axion-live http://127.0.0.1:18080/health/live
          grep -q '"status":"alive"' /tmp/axion-live
          api_status="$(curl --silent --output /tmp/axion-auth-response --write-out '%{http_code}' http://127.0.0.1:18080/auth/me)"
          test "$api_status" = "503"
          ! grep -qi '<!doctype html>' /tmp/axion-auth-response

  studio-browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright browser test runner
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install Chromium for browser tests
        run: npx playwright install chromium
      - name: Run AXYRON STUDIO browser end-to-end tests
        run: node tests/e2e/studio-browser.mjs

  qdrant-cloud-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qdrant client
        run: python -m pip install --disable-pip-version-check qdrant-client==1.20.0
      - name: Verify Qdrant Cloud with an isolated temporary collection
        env:
          QDRANT_URL: ${{ vars.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: python scripts/qdrant_cloud_smoke.py

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axion_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: axion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axion_ci -d axion_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://axion_ci:ci-only-password@localhost:5432/axion_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: python -m api.migrate
      - name: Verify migration idempotency
        run: python -m api.migrate
      - name: Verify PostgreSQL schema and billing transactions
        run: python -m pytest -q tests/test_postgres_migrations.py tests/test_billing_reservations_postgres.py tests/test_billing_execution_store_postgres.py tests/test_billing_execution_durable_postgres.py tests/test_email_verification_postgres.py tests/test_payment_manager_postgres.py tests/test_mfa_store_postgres.py
