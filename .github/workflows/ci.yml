name: AXION ATOMIC CI

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate AXION STUDIO JavaScript syntax
        run: python scripts/check_frontend_js.py
      - name: Compile Python modules
        run: python -m compileall -q api agent core rag sandbox audit tests scripts
      - name: Run unit tests
        env:
          API_KEY: ci-only-not-a-production-secret-0123456789
          DATABASE_URL: sqlite:///./ci-test.db
        run: python -m pytest -q

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axion_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: axion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axion_ci -d axion_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://axion_ci:ci-only-password@localhost:5432/axion_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: python -m api.migrate
      - name: Verify migration idempotency
        run: python -m api.migrate
      - name: Verify PostgreSQL schema and billing transactions
        run: python -m pytest -q tests/test_postgres_migrations.py tests/test_billing_reservations_postgres.py tests/test_billing_execution_store_postgres.py tests/test_billing_execution_durable_postgres.py tests/test_email_verification_postgres.py tests/test_payment_manager_postgres.py
