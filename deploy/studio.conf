# AXYRON STUDIO — servidor independiente (vhost).
#
# Sirve la aplicación Studio desde su propio root y enruta la API al mismo
# servicio interno. TLS y DNS son responsabilidad del operador: este contenedor
# escucha en :8080; el proxy de borde (nginx del host) termina HTTPS y reenvía
# studio.axyronatomic.com a este puerto, igual que el default server actual.
# Requiere un registro DNS studio.axyronatomic.com (A/AAAA/CNAME).
#
# Aislamiento: este root (/usr/share/nginx/studio) no comparte contenido con
# la web principal (/usr/share/nginx/html); no se sirven archivos de la landing
# desde aquí, ni viceversa.

server {
    listen 8080;
    server_name studio.axyronatomic.com;
    root /usr/share/nginx/studio;
    server_tokens off;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    # API compartida: MISMAS rutas y contratos que la web principal.
    location ~ ^/(auth|workspace|billing|health|v1)(/.*)?$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Healthcheck del vhost para el proxy de borde.
    location = /health/live {
        proxy_pass http://api:8000/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Activos con extensión: nunca pasan por el SPA.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|woff2?|ico|txt|map)$ {
        root /usr/share/nginx/studio;
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # SPA con rutas reales: cualquier otra ruta carga el documento.
    location / {
        root /usr/share/nginx/studio;
        try_files $uri $uri/ /index.html;
    }
}
