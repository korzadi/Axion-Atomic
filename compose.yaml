name: axion-atomic
services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      QDRANT_URL: ${QDRANT_URL:?Configure the Qdrant Cloud cluster URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Configure the Qdrant Cloud API key}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_ENABLED: "true"
      OLLAMA_MAX_CONCURRENT: ${OLLAMA_MAX_CONCURRENT:-1}
      OLLAMA_MAX_WAITING: ${OLLAMA_MAX_WAITING:-8}
      OLLAMA_QUEUE_TIMEOUT_SECONDS: ${OLLAMA_QUEUE_TIMEOUT_SECONDS:-20}
    ports: ["127.0.0.1:8070:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["./workspace:/workspace", "./knowledge:/knowledge:ro"]
    read_only: true
    tmpfs: ["/tmp:size=128m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.5
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["axion_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.75
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
volumes:
  axion_pgdata: {name: qwen_engineering_pgdata}
