name: qwen-engineering
services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      QDRANT_URL: http://qdrant:6333
    ports: ["127.0.0.1:8070:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
    volumes: ["./workspace:/workspace", "./knowledge:/knowledge:ro"]
    read_only: true
    tmpfs: ["/tmp:size=128m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.5
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["qwen_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.75
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports: ["127.0.0.1:6334:6333"]
    volumes: ["qwen_qdrant:/qdrant/storage"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
volumes:
  qwen_pgdata: {name: qwen_engineering_pgdata}
  qwen_qdrant: {name: qwen_engineering_qdrant}
