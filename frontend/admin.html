<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="dark">
<title>Axyron Atomic — Administración</title>
<style>
:root{color-scheme:dark;--bg:#070b18;--panel:#0d162b;--line:#223454;--text:#eaf2ff;--muted:#91a4c7;--cyan:#27d9f2;--violet:#a879ff;--red:#ff7188}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 5%,#12314b 0,transparent 40%),radial-gradient(ellipse at 90% 90%,#28164b 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(760px,100%)}.brand{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:.12em;margin-bottom:24px}.mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid #27d9f277;border-radius:13px;color:var(--cyan);box-shadow:0 0 28px #27d9f233;font-size:23px}.brand span:last-child{background:linear-gradient(90deg,var(--cyan),var(--violet));background-clip:text;color:transparent}
.panel{background:#0d162bef;border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,38px);box-shadow:0 24px 90px #0008;backdrop-filter:blur(18px)}h1{font-size:clamp(27px,5vw,38px);line-height:1.15;margin:0 0 8px}p{color:var(--muted);margin:8px 0 22px}.field{display:grid;gap:7px;margin:16px 0}label{color:#b9c9e5;font-size:13px}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#070f20;color:var(--text);font:inherit}button{border:0;border-radius:11px;padding:13px 18px;background:linear-gradient(110deg,var(--cyan),var(--violet));color:#07111f;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}.notice{padding:12px 14px;border:1px solid #27d9f255;background:#27d9f20d;border-radius:12px;margin:16px 0;color:#cceeff}.error{border-color:#ff718866;color:#ffc0ca;background:#ff71880d}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:20px 0}.tile{border:1px solid var(--line);border-radius:13px;padding:15px;background:#081225}.tile small{display:block;color:var(--muted);margin-bottom:5px}.tile strong{overflow-wrap:anywhere}.list{display:flex;gap:8px;flex-wrap:wrap}.tag{border:1px solid #27d9f255;border-radius:99px;padding:6px 10px;color:#bcefff;font-size:13px}.foot{font-size:12px;color:var(--muted);margin-top:18px}.foot a{color:var(--cyan)}
</style></head><body><main>
<div class="brand"><span class="mark">A</span><span>AXYRON ATOMIC · ADMIN</span></div>
<section class="panel">
<div id="login-view"><h1>Portal administrativo</h1><p>Acceso separado de Axyron Studio. Inicia sesión con una cuenta autorizada para consultar los permisos administrativos.</p>
<form id="login-form"><div class="field"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required maxlength="320"></div><div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><button id="login-submit" type="submit">Iniciar sesión</button></form>
<div id="mfa-view" class="hidden"><form id="mfa-form"><div class="field"><label for="mfa-code">Código de autenticación (6 dígitos)</label><input id="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div><button type="submit">Verificar MFA</button></form></div></div>
<div id="admin-view" class="hidden"><h1>Panel de administración</h1><p>Identidad y permisos confirmados por el backend.</p><div id="admin-data"></div><div class="actions"><button id="refresh" class="secondary">Actualizar permisos</button><button id="logout">Cerrar sesión</button></div></div>
<div id="notice" class="notice hidden" role="status" aria-live="polite"></div><div class="foot">Portal independiente · <a href="https://axyronatomic.com/">Volver a Axyron Atomic</a></div>
</section></main><script src="/admin.js" defer></script></body></html>
