<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conectando con AXYRON Studio…</title>
<meta name="description" content="Conectando tu sesión de Axyron Atomic con AXYRON Studio.">
<meta name="theme-color" content="#070b18">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2732%27 fill=%27%23070b18%27/%3E%3Cpath d=%27M32 8L12 52h10l10-25 10 25h10z%27 fill=%27%2327d9f2%27/%3E%3C/svg%3E">
<style>
  :root{--bg:#070b18;--tx:#eaf2ff;--mu:#91a4c7;--ac:#27d9f2}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .card{max-width:420px;padding:36px;border:1px solid rgba(117,154,220,.19);border-radius:18px;background:linear-gradient(150deg,rgba(17,28,53,.95),rgba(10,17,34,.96));text-align:center}
  .mark{width:56px;height:56px;margin:0 auto 18px;border-radius:14px;background:linear-gradient(135deg,#27d9f2,#438cff,#a879ff);display:grid;place-items:center;font-weight:950;color:#06111f;font-size:26px}
  h1{font-size:1.35rem;margin:0 0 8px;letter-spacing:-.02em}
  p{color:var(--mu);margin:0 0 18px;font-size:.95rem;line-height:1.6}
  .spinner{width:28px;height:28px;border:3px solid rgba(234,242,255,.18);border-top-color:var(--ac);border-radius:50%;margin:10px auto 0;animation:rot .9s linear infinite}
  .btn{display:inline-block;padding:11px 18px;border-radius:11px;border:1px solid rgba(117,154,220,.19);color:var(--tx);text-decoration:none;font-weight:700;margin-top:6px}
  .btn.primary{background:linear-gradient(120deg,#13bcd8,#397df0 58%,#8657e8);border:0;color:#041321}
  @keyframes rot{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none;border-top-color:var(--ac)}}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true">A</div>
  <h1>Conectando con AXYRON Studio…</h1>
  <p id="st-sso-status">Estamos iniciando tu sesión en <strong>AXYRON Studio</strong>. No se guardan credenciales en este enlace.</p>
  <div class="spinner" id="st-sso-spinner" role="status" aria-label="Conectando"></div>
  <div id="st-sso-fallback" hidden>
    <p>Tu sesión no está activa. Inicia sesión en la web principal y vuelve a pulsar «AXYRON Studio».</p>
    <a class="btn primary" href="/">Ir a iniciar sesión</a>
  </div>
</main>
<script>
(function () {
  var status = document.getElementById('st-sso-status');
  var spinner = document.getElementById('st-sso-spinner');
  var fallback = document.getElementById('st-sso-fallback');
  function fail(message) {
    status.textContent = message;
    spinner.hidden = true;
    fallback.hidden = false;
  }
  function csrf() {
    var match = document.cookie.match(/(?:^|; )axion_csrf=([^;]+)/);
    return match ? decodeURIComponent(match[1]) : '';
  }
  fetch('/auth/sso/authorize', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf() },
    body: '{}',
  }).then(function (response) {
    return response.json().catch(function () { return {}; }).then(function (data) {
      if (response.status === 401) return fail('Tu sesión no está activa todavía.');
      if (!response.ok) return fail(data.detail || 'No se pudo iniciar la conexión con el Studio.');
      if (data && data.studio_url) { window.location.assign(data.studio_url); return; }
      fail('La respuesta del servidor no fue válida.');
    });
  }).catch(function () {
    fail('No se pudo contactar con el servidor.');
  });
})();
</script>
</body>
</html>
